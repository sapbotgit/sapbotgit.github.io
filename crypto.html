<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sapbot@wallet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="desktop">
        <div class="window">
            <div class="title-bar">
                <div class="title-bar-text">
                    <span>🔐</span>
                    <span>wallet</span>
                </div>
                <div class="title-bar-controls">
                    <div class="title-bar-btn">_</div>
                    <div class="title-bar-btn">□</div>
                    <div class="title-bar-btn">×</div>
                </div>
            </div>
            <div class="window-body">
                <div class="about-section">
                    <h1>SECURE CRYPTO VAULT</h1>
                    <p>Encrypted Storage • All assets verified</p>
                    <div class="encrypted-badge">ENCRYPTED</div>
                </div>

                <div class="section-title">
                    <span>💰</span>
                    <span>Assets</span>
                </div>

                <div class="inset-panel">
                    <div class="wallet-grid" id="wallet-list">
                    </div>
                </div>

                <div class="status-bar">
                    <div class="status-bar-section" id="status-count">9 assets</div>
                    <div class="status-bar-section" id="status-footer">READY</div>
                    <div class="status-bar-section" id="status-time">--:--:--</div>
                </div>
            </div>
        </div>

        <div class="footer-links">
            <a href="/">[portfolio]</a>
            <a href="/code-doodles.html">[code_doodles]</a>
        </div>
    </div>

    <script>
        const walletData = [
            { id: 1, coin: "TRON", network: "Tron", address: "TQbpn2E2LKnULqxSkxhq9thiTWj2WmGt5S" },
            { id: 2, coin: "ETH", network: "Ethereum", address: "0x98fd926E0D1d6D49E7BB519B249f6D3a9528F5D8" },
            { id: 3, coin: "AKT", network: "Akash", address: "akash1xcgug6hu9a6r244mjp8q23x9e6p5x2az8py8xl" },
            { id: 4, coin: "OSMO", network: "Osmosis", address: "osmo1xcgug6hu9a6r244mjp8q23x9e6p5x2azzp6sfh" },
            { id: 5, coin: "BABY", network: "Babylon", address: "bbn1xcgug6hu9a6r244mjp8q23x9e6p5x2azayc3qu" },
            { id: 6, coin: "BCH", network: "Bitcoin Cash", address: "qztfhz6lcwgmdeyxv8gpsmz0hxx5c260rvv4sza3h6" },
            { id: 7, coin: "BTC", network: "Bitcoin", address: "1GSujd74Q5DrLKiMEtcnjwEpr6ZvPfWZky" },
            { id: 8, coin: "DOGE", network: "Dogecoin", address: "DS3oyWT75iSAxE2guxEkrgTrdDFQ34ETbz" },
            { id: 9, coin: "TST", network: "Test Token", address: "0x98fd926E0D1d6D49E7BB519B249f6D3a9528F5D8" }
        ];

        function renderWallet() {
            const container = document.getElementById('wallet-list');
            document.getElementById('status-count').textContent = `${walletData.length} assets`;
            container.innerHTML = '';
            
            walletData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'wallet-card';
                
                card.innerHTML = `
                    <div class="wallet-header">
                        <div>
                            <div class="wallet-coin">${item.coin}</div>
                            <div class="wallet-network">${item.network}</div>
                        </div>
                        <div class="wallet-status">ACTIVE</div>
                    </div>
                    <div class="wallet-address">${item.address}</div>
                    <div class="wallet-actions">
                        <button class="win95-btn" onclick="copyAddress('${item.coin}', '${item.address}', this)">
                            Copy Address
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function copyAddress(coin, address, btn) {
            navigator.clipboard.writeText(address).then(() => {
                const statusEl = document.getElementById('status-footer');
                statusEl.textContent = `${coin}_COPIED`;
                
                btn.classList.add('copied');
                btn.textContent = '✓ Copied';
                
                setTimeout(() => {
                    statusEl.textContent = 'READY';
                    btn.classList.remove('copied');
                    btn.textContent = 'Copy Address';
                }, 2000);
            }).catch(err => {
                const statusEl = document.getElementById('status-footer');
                statusEl.textContent = 'COPY_FAILED';
            });
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('status-time').textContent = 
                now.toLocaleTimeString('en-US', { hour12: false });
        }

        updateTime();
        setInterval(updateTime, 1000);
        renderWallet();
    </script>
</body>
</html>
